name: Backend CI/CD

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend.yml"
    pull_request:
        branches: [main]
        paths:
            - "backend/**"

env:
    ACR_NAME: ${{ vars.ACR_NAME }}
    IMAGE_NAME: kidchronicle-api
    CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
    RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
              working-directory: .

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            - name: Test
              run: npm run test --if-present
              continue-on-error: false

    build-and-deploy:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Login to ACR
              run: az acr login --name ${{ env.ACR_NAME }}

            - name: Get version from package.json
              id: version
              working-directory: backend
              run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              working-directory: backend
              run: |
                  IMAGE_BASE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"
                  docker build \
                    -t "${IMAGE_BASE}:${{ steps.version.outputs.version }}" \
                    -t "${IMAGE_BASE}:${{ github.sha }}" \
                    -t "${IMAGE_BASE}:latest" \
                    .
                  docker push "${IMAGE_BASE}" --all-tags

            - name: Deploy to Container App
              run: |
                  az containerapp update \
                    --name ${{ env.CONTAINER_APP_NAME }} \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
