name: Backend CI/CD

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - ".github/workflows/backend.yml"
    pull_request:
        branches: [main]
        paths:
            - "backend/**"
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment"
                type: choice
                options:
                    - dev
                    - prod
                default: dev

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci --registry https://registry.npmjs.org/
              working-directory: .

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            - name: Test
              run: npm run test --if-present
              continue-on-error: false

    build-and-push:
        needs: test
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment || 'dev' }}
        outputs:
            image-tag: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Login to ACR
              run: az acr login --name ${{ vars.ACR_NAME }}

            - name: Get version from package.json
              id: version
              working-directory: backend
              run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              working-directory: backend
              run: |
                  IMAGE_BASE="${{ vars.ACR_NAME }}.azurecr.io/kidchronicle-api"
                  docker build \
                    -t "${IMAGE_BASE}:${{ steps.version.outputs.version }}" \
                    -t "${IMAGE_BASE}:${{ github.sha }}" \
                    -t "${IMAGE_BASE}:latest" \
                    .
                  docker push "${IMAGE_BASE}" --all-tags

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment || 'dev' }}
        steps:
            - name: Login to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy to Container App
              run: |
                  az containerapp registry set \
                    --name ${{ vars.CONTAINER_APP_NAME }} \
                    --resource-group ${{ vars.RESOURCE_GROUP }} \
                    --server ${{ vars.ACR_NAME }}.azurecr.io \
                    --username ${{ vars.ACR_NAME }} \
                    --password "$(az acr credential show --name ${{ vars.ACR_NAME }} --query 'passwords[0].value' -o tsv)"
                  az containerapp update \
                    --name ${{ vars.CONTAINER_APP_NAME }} \
                    --resource-group ${{ vars.RESOURCE_GROUP }} \
                    --image ${{ vars.ACR_NAME }}.azurecr.io/kidchronicle-api:${{ needs.build-and-push.outputs.image-tag }}
